name: Build plugin

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "esbuild.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Commit compiled main.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          if git diff --cached --quiet; then
            echo "main.js is up to date"
          else
            git commit -m "chore: rebuild main.js [skip ci]"
            git push
          fi
